{% extends 'base.html' %}

{% block title %}Password Reset | SuitabilityDesk{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <h1>Password Reset</h1>

                <p class="text-muted">
                    Enter your email address and Django will send a secure password reset link.
                </p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button class="btn btn-primary" type="submit">
                        Send reset email
                    </button>

                    <a class="btn btn-outline-secondary" href="{% url 'login' %}">
                        Back to Login
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
