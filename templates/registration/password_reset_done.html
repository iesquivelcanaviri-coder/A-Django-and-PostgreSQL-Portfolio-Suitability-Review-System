{% extends 'base.html' %}

{% block title %}Password Reset Sent | SuitabilityDesk{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1>Check your email</h1>

        <p>
            If the email address exists on an active account, a secure password reset link has been sent.
            Please check your inbox and spam folder.
        </p>

        <a class="btn btn-primary" href="{% url 'login' %}">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
